<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A.T.H - Cổng Không Gian</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/home.css">
</head>
<body>
    <div class="stars"></div>
    <header>⚙️ CỔNG KHÔNG GIAN ⚙️</header>

    <div class="container">
        <div class="zone" data-type="plus">
            <h2>🛠️ XƯỞNG ĐÚC</h2>
            <p>Gom kim loại chế tạo khung.<br><b>(Phép Cộng)</b></p>
            <div class="status-bar"><div class="progress" style="width: 70%"></div></div>
        </div>

        <div class="zone" data-type="minus">
            <h2>⚙️ GIẢM TRỌNG</h2>
            <p>Loại bỏ linh kiện thừa.<br><b>(Phép Trừ)</b></p>
            <div class="status-bar"><div class="progress" style="width: 30%"></div></div>
        </div>

        <div class="zone" data-type="multiply" onclick="window.location.href='/api/multiplication_race'" style="cursor: pointer;">
            <h2>⚡ ĐƯỜNG ĐUA</h2>
            <p>Thu thập lõi năng lượng.<br><b>(Phép Nhân)</b></p>
            <div class="status-bar"><div class="progress" style="width: 10%"></div></div>
        </div>

        <div class="zone" data-type="divide" onclick="window.location.href='/lake'" style="cursor: pointer;">
            <h2>💧 HỒ THỦY LỰC</h2>
            <p>Săn tìm vũ khí cổ đại.<br><b>(Phép Chia)</b></p>
            <div class="status-bar"><div class="progress" style="width: 0%"></div></div>
        </div>
    </div>

    <footer>Hệ thống Gara Robot v1.0 | Trạng thái: Online</footer>

    <script src="../static/js/home.js"></script>
</body>
</html>
